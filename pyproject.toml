[project]
name = "picturehouse"
version = "0.1.0"
description = "Home media server: folder library, metadata, streaming and DLNA."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "sqlalchemy>=2.1.4",
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "guessit>=4.4.0",
    "tomlkit>=0.15.1",
    "watchfiles>=1.3.0",
    "httpx>=0.28.1",
    "cryptography>=50.0.2",
    "pillow>=11",
    "pillow-heif>=0.20",
]

[project.scripts]
picturehouse = "picturehouse.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/picturehouse"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyinstaller==6.22.3",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# Line length is the formatter's job; E501 only fires on lines marked `fmt: skip`.
ignore = ["E501"]

<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Home Media Server UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail (bottom tab bar on phones) + a scrolling canvas where artwork leads and text sits on top of it.
   Deliberately dark-only: a media app is used in dim rooms, and artwork reads best on a dark ground. */
:root {
  color-scheme: dark;
  --bg: #0a0d11;
  --bg-rail: #080a0d;
  --surface: #121821;
  --surface-2: #19212c;
  --line: #243041;
  --fg: #eef1f4;
  --muted: #93a0b0;
  --faint: #5f6b7a;
  --accent: #f2b33d;          /* projector-lamp amber */
  --accent-ink: #1b1305;
  --good: #5fc48b;
  --mid: #7fb2e5;
  --warn: #ec8a4c;
  --bad: #e5605c;
  --display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --gut: clamp(16px, 3vw, 40px);
  --rail: 88px;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
img { display: block; }
.ico { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ico.fill { fill: currentColor; stroke: none; }

/* ---------- Rail ---------- */
.rail { position: fixed; left: 0; top: 0; bottom: 0; width: var(--rail); z-index: 20;
  padding-block: calc(env(safe-area-inset-top, 0px) + 18px) 18px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  background: var(--bg-rail); border-right: 1px solid var(--line); }
.logo { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; margin-bottom: 18px;
  background: var(--accent); color: var(--accent-ink); font: 900 17px/1 var(--display); font-stretch: 70%; letter-spacing: .02em; }
.navbtn { width: 72px; padding-block: 10px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px;
  color: var(--muted); font-size: 11.5px; font-weight: 600; letter-spacing: .02em; }
.navbtn:hover { color: var(--fg); background: var(--surface); }
.navbtn.on { color: var(--fg); }
.navbtn.on .ico { color: var(--accent); }
.rail .spacer { flex: 1; }

/* ---------- Main ---------- */
.main { margin-left: var(--rail); padding-inline: var(--gut); padding-block: 14px 72px; min-width: 0; }
.top { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding-block: 4px 18px; position: relative; z-index: 15; }
.search { flex: 1 1 240px; max-width: 460px; display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 42px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 21px; color: var(--muted); }
.search:focus-within { border-color: var(--accent); }
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--fg); font: inherit; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.srv { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.led { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 22%, transparent); }
.devwrap { position: relative; }
.devbtn { display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 14px; border-radius: 21px; border: 1px solid var(--line);
  background: var(--surface); font-size: 13px; white-space: nowrap; }
.devbtn span { color: var(--muted); }
.devbtn:hover { border-color: var(--faint); }
.devmenu { position: absolute; right: 0; top: 50px; width: min(300px, calc(100vw - 32px)); background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 12px; padding: 6px; box-shadow: 0 18px 40px rgba(0,0,0,.5); }
.devmenu h3 { margin: 6px 10px 6px; font: 600 11px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.devopt { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; text-align: left; padding: 10px; border-radius: 8px; }
.devopt:hover, .devopt:focus-visible { background: var(--surface); outline: none; }
.devopt b { font-weight: 600; font-size: 14px; }
.devopt small { grid-column: 1; color: var(--muted); font-size: 12px; }
.devopt .tick { grid-row: 1 / span 2; grid-column: 2; align-self: center; color: var(--accent); visibility: hidden; }
.devopt.on .tick { visibility: visible; }

/* ---------- Hero ---------- */
.hero { position: relative; isolation: isolate; border-radius: 14px; overflow: hidden; display: flex; align-items: flex-end;
  min-height: clamp(380px, 44vw, 560px); background: var(--surface); }
.hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
.hero-shade { position: absolute; inset: 0; z-index: -1;
  background: linear-gradient(90deg, rgba(10,13,17,.92) 0%, rgba(10,13,17,.55) 45%, rgba(10,13,17,0) 75%),
              linear-gradient(0deg, rgba(10,13,17,.85) 0%, rgba(10,13,17,0) 50%); }
.hero-body { padding: clamp(20px, 4vw, 48px); max-width: 640px; display: grid; gap: 12px; min-width: 0; }
.eyebrow { margin: 0; font: 600 12px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.hero-title { margin: 0; font: 850 clamp(44px, 7.4vw, 104px)/.88 var(--display); font-stretch: 68%; text-transform: uppercase; letter-spacing: -.005em; text-wrap: balance; }
.meta { margin: 0; color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.hero-syn { margin: 0; color: #cfd6de; max-width: 52ch; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 20px; border-radius: 8px; font-weight: 600;
  background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.14); backdrop-filter: blur(6px); white-space: nowrap; }
.btn:hover { background: rgba(255,255,255,.16); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { background: #f7c35f; }
.btn.small { height: 34px; padding: 0 12px; font-size: 13px; border-radius: 7px; }
.btn .ico { width: 18px; height: 18px; }
.hero-dots { position: absolute; right: clamp(16px, 3vw, 32px); bottom: clamp(16px, 3vw, 32px); display: flex; gap: 8px; }
.dot { width: 28px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.3); }
.dot.on { background: var(--fg); }

.decision { margin: 2px 0 0; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--fg); flex-wrap: wrap; }
.decision .sub { color: var(--muted); }
.dotc { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex: none; }
.decision.mid .dotc { background: var(--mid); }
.decision.warn .dotc { background: var(--warn); }

/* ---------- Rows & cards ---------- */
.sec { margin-top: 34px; min-width: 0; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.sec-head h2 { margin: 0; font: 750 21px/1.1 var(--display); font-stretch: 82%; letter-spacing: .01em; }
.link { color: var(--muted); font-size: 13px; font-weight: 600; }
.link:hover { color: var(--fg); }
.row { display: flex; gap: 14px; overflow-x: auto; padding-block: 6px 14px; scroll-snap-type: x proximity; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.row > * { scroll-snap-align: start; }

.card { flex: 0 0 auto; text-align: left; display: grid; gap: 8px; align-content: start; outline: none; }
.card .art { position: relative; overflow: hidden; border-radius: 7px; background: var(--surface); transition: transform .18s ease, box-shadow .18s ease; }
.card .art img { width: 100%; height: 100%; object-fit: cover; }
.card:hover .art { transform: translateY(-3px); box-shadow: 0 14px 28px rgba(0,0,0,.45); }
.card:focus-visible .art { outline: 3px solid var(--accent); outline-offset: 3px; transform: scale(1.03); }
.card .cap { display: grid; gap: 1px; min-width: 0; padding-inline: 2px; }
.card .cap b { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .cap span { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.poster { width: clamp(124px, 13vw, 176px); }
.poster .art { aspect-ratio: 2 / 3; }
.poster .ptitle { position: absolute; left: 0; right: 0; bottom: 0; padding: 30px 10px 10px;
  background: linear-gradient(0deg, rgba(0,0,0,.72), rgba(0,0,0,0));
  font: 850 clamp(15px, 1.5vw, 19px)/.92 var(--display); font-stretch: 66%; text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
.land { width: clamp(232px, 25vw, 330px); }
.land .art { aspect-ratio: 16 / 9; }
.square { width: clamp(132px, 13vw, 176px); }
.square .art { aspect-ratio: 1; }
.prog { position: absolute; left: 10px; right: 10px; bottom: 10px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.25); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); }
.playhint { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity .15s; background: rgba(0,0,0,.25); }
.playhint span { width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,.92); color: #0a0d11; display: grid; place-items: center; }
.card:hover .playhint, .card:focus-visible .playhint { opacity: 1; }
.tag { position: absolute; top: 8px; left: 8px; font: 500 10.5px/1 var(--mono); padding: 4px 6px; border-radius: 4px; background: rgba(0,0,0,.6); color: #dfe5ea; }

/* ---------- Page heads & grids ---------- */
.page-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 14px; margin-block: 8px 20px; }
.page-head h1 { margin: 0; font: 850 clamp(36px, 5vw, 60px)/.9 var(--display); font-stretch: 70%; text-transform: uppercase; }
.page-head p { margin: 6px 0 0; color: var(--muted); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid var(--line); font-size: 13px; font-weight: 600; color: var(--muted); }
.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip:hover:not(.on) { color: var(--fg); border-color: var(--faint); }
.grid { display: grid; gap: 22px 16px; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); }
.grid .poster, .grid .square { width: auto; }
.grid.wide { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.grid.wide .land { width: auto; }

/* ---------- Detail ---------- */
.back { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px 0 8px; border-radius: 8px; color: var(--muted); font-weight: 600; font-size: 14px; margin-bottom: 12px; }
.back:hover { color: var(--fg); background: var(--surface); }
.d-back { position: relative; border-radius: 14px; overflow: hidden; aspect-ratio: 21 / 8; min-height: 200px; background: var(--surface); }
.d-back img { width: 100%; height: 100%; object-fit: cover; }
.d-back::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, var(--bg) 0%, rgba(10,13,17,0) 60%); }
.d-main { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: clamp(20px, 3vw, 40px); margin-top: -110px; position: relative; padding-inline: clamp(0px, 2vw, 24px); }
.d-main.noposter { grid-template-columns: minmax(0, 1fr); margin-top: -70px; }
.d-poster { border-radius: 9px; overflow: hidden; aspect-ratio: 2 / 3; box-shadow: 0 20px 40px rgba(0,0,0,.6); align-self: start; }
.d-poster.sq { aspect-ratio: 1; }
.d-poster img { width: 100%; height: 100%; object-fit: cover; }
.d-info { display: grid; gap: 14px; align-content: start; min-width: 0; padding-top: 40px; }
.d-title { margin: 0; font: 850 clamp(38px, 5.6vw, 76px)/.9 var(--display); font-stretch: 68%; text-transform: uppercase; text-wrap: balance; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; }
.badge { font: 500 11px/1 var(--mono); padding: 5px 7px; border: 1px solid var(--line); border-radius: 4px; color: #c4ccd5; }
.d-syn { margin: 0; max-width: 64ch; color: #d3d9e0; }
.credits { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; font-size: 14px; }
.credits dt { color: var(--muted); }
.credits dd { margin: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; min-width: 0; }
.panel h3 { margin: 0 0 10px; font: 600 11.5px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; font: 12.5px/1.5 var(--mono); }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.d-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.matchline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }

.seasons { display: flex; gap: 8px; flex-wrap: wrap; margin-block: 26px 14px; }
.eps { display: grid; gap: 4px; }
.ep { display: grid; grid-template-columns: 34px 168px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 10px; border-radius: 10px; text-align: left; outline: none; }
.ep:hover, .ep:focus-visible { background: var(--surface); }
.ep:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
.ep .n { font: 700 22px/1 var(--display); font-stretch: 75%; color: var(--faint); text-align: right; }
.ep .thumb { position: relative; border-radius: 6px; overflow: hidden; aspect-ratio: 16 / 9; }
.ep .thumb img { width: 100%; height: 100%; object-fit: cover; }
.ep .t { min-width: 0; display: grid; gap: 2px; }
.ep .t b { font-weight: 600; }
.ep .t span { color: var(--muted); font-size: 13px; }
.ep .st { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.ep .st.done { color: var(--good); }
.tracks { display: grid; margin-top: 8px; }
.trk { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 11px 12px; border-radius: 8px; text-align: left; outline: none; font-variant-numeric: tabular-nums; }
.trk:hover, .trk:focus-visible { background: var(--surface); }
.trk:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
.trk .n { color: var(--faint); text-align: right; }
.trk.on b { color: var(--accent); }
.trk span:last-child { color: var(--muted); font-size: 13px; }

/* ---------- Library management ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.stat b { display: block; font: 800 30px/1 var(--display); font-stretch: 78%; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 13px; }
.scan { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 20px; margin-top: 14px; }
.scan .what { flex: 1 1 260px; min-width: 0; display: grid; gap: 8px; }
.bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s linear; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font: 600 11px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.mono { font: 12.5px/1.4 var(--mono); color: #c4ccd5; white-space: nowrap; }
td.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 12px; white-space: nowrap;
  background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.off { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); }
.pill.bad { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.pill.quiet { background: var(--surface-2); color: var(--muted); }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; margin-top: 14px; }
.issue { display: grid; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.issue:last-child { border-bottom: 0; }
.issue code { font: 12.5px/1.4 var(--mono); color: #dfe5ea; overflow-wrap: anywhere; }
.issue p { margin: 0; color: var(--muted); font-size: 13.5px; }
.cands { display: flex; flex-wrap: wrap; gap: 8px; }
.cand { display: inline-flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); font-size: 13px; text-align: left; }
.cand:hover, .cand:focus-visible { border-color: var(--accent); outline: none; }
.cand em { font: normal 500 11px/1 var(--mono); color: var(--muted); }
.cand.best em { color: var(--good); }
.done-line { color: var(--good); font-size: 13.5px; font-weight: 600; }

/* ---------- Player ---------- */
.player { position: fixed; inset: 0; z-index: 50; background: #000; color: #fff; overflow: hidden; }
.pv { position: absolute; inset: 0; }
.pv img { width: 100%; height: 100%; object-fit: cover; opacity: .9; animation: drift 40s ease-in-out infinite alternate; }
.player.paused .pv img { animation-play-state: paused; filter: brightness(.6); }
@keyframes drift { from { transform: scale(1.04) translate(0, 0); } to { transform: scale(1.12) translate(-2%, -1%); } }
.ptop, .pctrl { position: absolute; left: 0; right: 0; padding-inline: clamp(16px, 4vw, 48px); }
.ptop { top: 0; padding-block: calc(env(safe-area-inset-top, 0px) + 18px) 60px; display: flex; align-items: center; gap: 14px; background: linear-gradient(180deg, rgba(0,0,0,.7), transparent); }
.ptop .pt { min-width: 0; display: grid; }
.ptop .pt b { font: 800 clamp(20px, 3vw, 30px)/1 var(--display); font-stretch: 72%; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ptop .pt span { color: rgba(255,255,255,.7); font-size: 13px; }
.pbtn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.pbtn:hover, .pbtn:focus-visible { background: rgba(255,255,255,.14); outline: none; }
.pbtn:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
.pbtn.big { width: 64px; height: 64px; background: #fff; color: #000; }
.pbtn.big:hover { background: #fff; }
.pbtn.big .ico { width: 26px; height: 26px; }
.pctrl { bottom: 0; padding-block: 80px calc(env(safe-area-inset-bottom, 0px) + 22px); background: linear-gradient(0deg, rgba(0,0,0,.8), transparent); display: grid; gap: 12px; }
.scrub { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; font: 13px/1 var(--mono); font-variant-numeric: tabular-nums; }
.scrub input { width: 100%; accent-color: var(--accent); }
.pbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pbar .grow { flex: 1; }
.ptxt { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 8px; font-size: 13px; font-weight: 600; }
.ptxt:hover, .ptxt:focus-visible { background: rgba(255,255,255,.14); outline: none; }
.ptxt:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
.ptxt small { color: rgba(255,255,255,.65); font-weight: 500; }
.pinfo { position: absolute; right: clamp(16px, 4vw, 48px); top: calc(env(safe-area-inset-top, 0px) + 90px); width: min(380px, calc(100vw - 32px));
  background: rgba(10,13,17,.86); border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 16px; backdrop-filter: blur(10px); }
.pinfo h3 { margin: 0 0 10px; font: 600 11.5px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.55); }

/* ---------- Mini player & toast ---------- */
.mini { position: fixed; right: 16px; bottom: 16px; z-index: 30; width: min(380px, calc(100vw - 32px)); display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center;
  padding: 10px; padding-right: 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 18px 40px rgba(0,0,0,.5); }
.mini img { width: 52px; height: 52px; border-radius: 6px; }

/* ---------- Helpers ---------- */
const sub = it => it.type === 'film' ? `${it.year} · ${it.genre}` : it.type === 'tv' ? `${it.seasons.length} season${it.seasons.length > 1 ? 's' : ''} · ${it.genre}` : it.type === 'album' ? `${it.artist} · ${it.year}` : `${it.date} · ${it.run}`;
const metaOf = it => {

  if (it.type === 'tv') return [it.years, `${it.seasons.length} season${it.seasons.length > 1 ? 's' : ''}`, it.genre, it.cert, m.res + (m.hdr ? ' HDR' : '')];
  if (it.type === 'home') return ['Home video', it.date, it.run, m.res + (m.hdr ? ' HDR' : '')];

const epTitle = (t, s, e) => `S${s + 1} · E${e + 1} ${t.seasons[s][e]}`;
const mins = run => { const h = /(\d+)h/.exec(run), m = /(\d+)m/.exec(run); return (h ? +h[1] * 60 : 0) + (m ? +m[1] : 0); };

function posterCard(it) {

  const kind = it.type === 'album' ? 's' : 'p';
  return `<button class="card ${it.type === 'album' ? 'square' : 'poster'}" data-nav data-open="${it.id}" aria-label="${it.title}">

    <span class="cap"><b>${it.title}</b><span>${sub(it)}</span></span></button>`;
}
function landCard(it, opts = {}) {
  const seed = opts.s != null ? `${it.id}-s${opts.s}e${opts.e}` : null;
  const title = opts.s != null ? it.title : it.title;
  const line = opts.s != null ? `S${opts.s + 1} · E${opts.e + 1} ${it.seasons[opts.s][opts.e]}` : (opts.left ? `${opts.left}` : sub(it));

        <tr><td>Living room TV</td><td>DLNA</td><td class="mono">lg-webos · HEVC, HDR10, no TrueHD</td><td>Now</td></tr>

}
function vSearch(q) {
  const t = q.trim().toLowerCase();
  const res = ALL.filter(it => [it.title, it.genre, it.artist, it.cast, it.dir].some(v => v && v.toLowerCase().includes(t)));
  return `<div class="page-head"><div><h1>Search</h1><p>${res.length} result${res.length === 1 ? '' : 's'} for “${q.replace(/</g, '&lt;')}”</p></div></div>
    ${res.length ? `<div class="grid">${res.map(posterCard).join('')}</div>` : `<p style="color:var(--muted)">Nothing matches. Try a title, an actor or an artist.</p>`}`;
}

/* ---------- Render & navigation ---------- */
function render(focusFirst) {
  const v = $('#view');
  try {
    v.innerHTML = S.view === 'home' ? vHome() : S.view === 'detail' ? vDetail(S.param) : S.view === 'library' ? vLibrary() : S.view === 'search' ? vSearch(S.param) : vGrid(S.view);
  } catch (e) { v.innerHTML = `<p style="color:var(--bad)">This view failed to draw: ${e.message}</p>`; }
  document.querySelectorAll('.navbtn').forEach(b => b.classList.toggle('on', b.dataset.go === S.view));
  renderDev();
  if (focusFirst) { const f = v.querySelector('[data-nav]'); if (f) f.focus({ preventScroll: true }); }
}
function go(view, param) {
  if (S.view === view && S.param === param) return;
  if (view !== 'search') S.hist.push([S.view, S.param]);
  S.view = view; S.param = param; if (view === 'detail') S.season = (byId(param) && byId(param).current) ? byId(param).current.s : 0;
  render(view !== 'search'); if (view !== 'search') window.scrollTo(0, 0);
}
function back() {
  const p = S.hist.pop(); if (!p) { if (S.view !== 'home') { S.view = 'home'; S.param = null; render(true); } return; }
  S.view = p[0]; S.param = p[1]; render(true); window.scrollTo(0, 0);
}
function renderDev() {
  $('#devbtn').innerHTML = `${ico('cast')}<span>Play to</span><strong>${dev().name}</strong>`;
  $('#devmenu').innerHTML = `<h3>Play to</h3>` + DEVICES.map(d => `<button class="devopt ${d.id === S.dev ? 'on' : ''}" data-nav data-dev="${d.id}"><b>${d.name}</b><small>${d.kind}</small><span class="tick">${ico('check')}</span></button>`).join('');
}
function toggleDevMenu(open) {
  const m = $('#devmenu'); const show = open == null ? m.hidden : open; m.hidden = !show;
  $('#devbtn').setAttribute('aria-expanded', String(show));
  if (show) { const on = m.querySelector('.devopt.on'); if (on) on.focus(); }
}
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }

/* ---------- Video player ---------- */
const SUBS = ['Off', 'English', 'English SDH'], AUDS = ['English', 'Commentary'];
function openPlayer(it, s, e, pct) {
  const isEp = s != null && s !== '';
  const label = isEp ? `${it.title}` : it.title;
  const total = mins(it.run) * 60;
  S.player = { it, pos: total * ((+pct || 0) / 100), total, playing: true, sub: 0, aud: 0 };
  $('#pimg').src = art(it, 'b', isEp ? `${it.id}-s${s}e${e}` : null);
  $('#ptitle').textContent = label;
  const d = decide(it);
  $('#pdev').textContent = (isEp ? epTitle(it, +s, +e) + ' · ' : '') + `${dev().name} · ${d.mode}`;
  $('#pinfobody').innerHTML = `<dt>Source</dt><dd>${it.vline || 'H.264 · 1920×1080'}</dd><dt>Audio</dt><dd>${it.aline || 'AC-3 5.1'}</dd><dt>Delivery</dt><dd>${d.mode}</dd><dt>Output</dt><dd>${d.out}</dd><dt>Server</dt><dd>${d.ff}</dd><dt>Via</dt><dd>${S.dev === 'browser' ? 'HLS over HTTP' : S.dev === 'cast' ? 'Cast · HLS' : S.dev === 'ipad' ? 'AirPlay · HLS' : 'DLNA · HTTP stream'}</dd>`;
  $('#pinfo').hidden = true; $('#psubv').textContent = SUBS[0]; $('#paudv').textContent = AUDS[0];
  const sc = $('#pscrub'); sc.max = total; sc.value = S.player.pos; $('#ptot').textContent = clock(total);
  if (S.music) { S.music.playing = false; drawMini(); }
  $('#player').hidden = false; drawPlayer(); $('#pplay').focus();
}
function drawPlayer() {
  const p = S.player; if (!p) return;
  $('#player').classList.toggle('paused', !p.playing);
  $('#pplay').innerHTML = p.playing ? PAUSE : PLAY; $('#pplay').setAttribute('aria-label', p.playing ? 'Pause' : 'Play');
  $('#pcur').textContent = clock(p.pos); $('#pscrub').value = p.pos;
}
function closePlayer() { $('#player').hidden = true; S.player = null; const f = document.querySelector('#view [data-nav]'); if (f) f.focus({ preventScroll: true }); }

/* ---------- Music mini player ---------- */
function playTrack(id, i) {
  const al = byId(id); const [n, t] = al.tracks[i]; const [mm, ss] = t.split(':').map(Number);
  S.music = { id, i, pos: 0, len: mm * 60 + ss, playing: true };
  $('#mimg').src = art(al, 's'); $('#mt').textContent = n; $('#ma').textContent = `${al.artist} · ${al.title}`;
  $('#mini').hidden = false; drawMini();
  if (S.view === 'detail' && S.param === id) document.querySelectorAll('.trk').forEach((b, k) => b.classList.toggle('on', k === i));
}
function drawMini() {
  const m = S.music; if (!m) return;
  $('#mplay').innerHTML = m.playing ? PAUSE : PLAY; $('#mplay').setAttribute('aria-label', m.playing ? 'Pause' : 'Play');
  $('#mprog').style.width = (m.pos / m.len * 100) + '%';
}
setInterval(() => {
  const p = S.player;
  if (p && p.playing && !$('#player').hidden) { p.pos = Math.min(p.total, p.pos + 1); if (p.pos >= p.total) p.playing = false; drawPlayer(); }
  const m = S.music;
  if (m && m.playing) { m.pos += 1; if (m.pos >= m.len) { const al = byId(m.id); if (m.i + 1 < al.tracks.length) playTrack(m.id, m.i + 1); else { m.playing = false; m.pos = m.len; } } drawMini(); }
}, 1000);

/* ---------- Rescan simulation ---------- */
let scanning = false;
function rescan() {
  if (scanning) return; scanning = true;
  const steps = [['Films', 412], ['TV', 2318], ['Music', 286], ['Home videos', 138]]; let k = 0, n = 0;
  const btn = $('#rescan'); if (btn) { btn.disabled = true; btn.textContent = 'Scanning…'; }
  const tick = setInterval(() => {
    const [name, total] = steps[k]; n = Math.min(total, n + Math.ceil(total / 8));
    const t = $('#scanTitle'), s = $('#scanSub'), bar = $('#scanBar');
    if (t) t.textContent = `Scanning ${name}`; if (s) s.textContent = `${n.toLocaleString('en-GB')} of ${total.toLocaleString('en-GB')} checked. Unchanged files are skipped.`;
    if (bar) bar.style.width = ((k + n / total) / steps.length * 100) + '%';
    if (n >= total) { k++; n = 0; }
    if (k >= steps.length) {
      clearInterval(tick); scanning = false;
      const now = new Date(); const hh = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
      if (t) t.textContent = `Last scan finished at ${hh}`; if (s) s.textContent = 'No new files, 0 changed. Archive share still offline.';
      if (bar) bar.style.width = '0%'; const b = $('#rescan'); if (b) { b.disabled = false; b.textContent = 'Scan all folders'; }
      document.querySelector('.srv').innerHTML = `<span class="led"></span>Server online · scanned ${hh}`;
      toast('Scan finished · nothing new');
    }
  }, 160);
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) { if (!e.target.closest('.devwrap')) toggleDevMenu(false); return; }
  const ds = t.dataset;
  if (t.id === 'devbtn' || 'devmenu' in ds) { e.stopPropagation(); toggleDevMenu(); return; }
  if (!t.closest('.devwrap')) toggleDevMenu(false);
  if (ds.dev) { S.dev = ds.dev; try { localStorage.setItem('hm-dev', S.dev); } catch (err) {} toggleDevMenu(false); render(false); $('#devbtn').focus(); toast(`Playing to ${dev().name}`); return; }
  if (ds.go) { $('#q').value = ''; S.sort = 'added'; go(ds.go, null); return; }
  if (ds.open) { go('detail', ds.open); return; }
  if (ds.play) { openPlayer(byId(ds.play), ds.s, ds.e, ds.pct); return; }
  if ('back' in ds) { back(); return; }
  if (ds.feat) { S.feat = +ds.feat; render(false); const d = document.querySelector(`[data-feat="${ds.feat}"]`); if (d) d.focus({ preventScroll: true }); return; }
  if (ds.season) { S.season = +ds.season; render(false); const c = document.querySelector(`[data-season="${ds.season}"]`); if (c) c.focus({ preventScroll: true }); return; }
  if (ds.sort) { S.sort = ds.sort; render(false); const c = document.querySelector(`[data-sort="${ds.sort}"]`); if (c) c.focus({ preventScroll: true }); return; }
  if (ds.track) { playTrack(ds.track, +ds.i); return; }
  if (ds.match) { S.matched[ds.match] = ds.name; render(false); toast('Match saved'); return; }
  if (ds.toast) { toast(ds.toast); return; }
  if (t.id === 'rescan') { rescan(); return; }
  if (t.id === 'mplay' && S.music) { S.music.playing = !S.music.playing; drawMini(); return; }
  const p = S.player; if (!p) return;
  if (t.id === 'pclose') closePlayer();
  else if (t.id === 'pplay') { p.playing = !p.playing; drawPlayer(); }
  else if (t.id === 'pback') { p.pos = Math.max(0, p.pos - 10); drawPlayer(); }
  else if (t.id === 'pfwd') { p.pos = Math.min(p.total, p.pos + 30); drawPlayer(); }
  else if (t.id === 'psub') { p.sub = (p.sub + 1) % SUBS.length; $('#psubv').textContent = SUBS[p.sub]; }
  else if (t.id === 'paud') { p.aud = (p.aud + 1) % AUDS.length; $('#paudv').textContent = AUDS[p.aud]; }
  else if (t.id === 'pinf') { $('#pinfo').hidden = !$('#pinfo').hidden; }
});
$('#pscrub').addEventListener('input', e => { if (S.player) { S.player.pos = +e.target.value; $('#pcur').textContent = clock(S.player.pos); } });
$('#q').addEventListener('input', e => {
  const v = e.target.value;
  if (v.trim()) { if (S.view !== 'search') S.hist.push([S.view, S.param]); S.view = 'search'; S.param = v; render(false); }
  else if (S.view === 'search') back();
});

/* Spatial navigation for TV remotes and keyboards */
function visible(el) { const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0 && !el.closest('[hidden]'); }
function moveFocus(dir) {
  const scope = !$('#player').hidden ? $('#player') : !$('#devmenu').hidden ? $('#devmenu') : document;
  const all = [...scope.querySelectorAll('[data-nav]')].filter(visible).filter(el => scope !== document || !el.closest('#player, #devmenu'));
  const cur = document.activeElement;
  if (!all.includes(cur)) { (all[0] || {}).focus && all[0].focus(); return; }
  const a = cur.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  let best = null, bestScore = Infinity;
  for (const el of all) {
    if (el === cur) continue;
    const r = el.getBoundingClientRect(), bx = r.left + r.width / 2, by = r.top + r.height / 2;
    const dx = bx - ax, dy = by - ay;
    let main, cross;
    if (dir === 'ArrowRight') { if (r.left < a.right - 4) continue; main = dx; cross = Math.abs(dy); }
    else if (dir === 'ArrowLeft') { if (r.right > a.left + 4) continue; main = -dx; cross = Math.abs(dy); }
    else if (dir === 'ArrowDown') { if (r.top < a.bottom - 4) continue; main = dy; cross = Math.abs(dx); }
    else { if (r.bottom > a.top + 4) continue; main = -dy; cross = Math.abs(dx); }
    const score = main + cross * 2.2;
    if (score < bestScore) { bestScore = score; best = el; }
  }
  if (best) { best.focus({ preventScroll: true }); best.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' }); }
}
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (e.key === 'Escape' || (e.key === 'Backspace' && tag !== 'input')) {
    if (!$('#devmenu').hidden) { toggleDevMenu(false); $('#devbtn').focus(); }
    else if (!$('#player').hidden) closePlayer();
    else back();
    e.preventDefault(); return;
  }
  if (e.key.startsWith('Arrow')) {
    if (tag === 'input' && e.target.type === 'range') return;
    if (tag === 'input' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) return;
    e.preventDefault(); moveFocus(e.key);
  }
  if (e.key === ' ' && S.player && !$('#player').hidden && tag !== 'button') { S.player.playing = !S.player.playing; drawPlayer(); e.preventDefault(); }
});

render(false);
})();
</script>

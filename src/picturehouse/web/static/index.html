<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0d11">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PictureHouse">
<title>PictureHouse</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/static/app.css">
<!-- The theme (docs/themes.md): the server's default, or this device's own choice. -->
<link rel="stylesheet" href="/theme.css" id="themecss">
<script>try{var t=localStorage.getItem("ph.theme");if(t)document.getElementById("themecss").href="/theme.css?id="+encodeURIComponent(t);}catch(e){}</script>
</head>
<body>

<nav class="rail" aria-label="Main">
  <div class="logo" aria-hidden="true">PH</div>
  <button class="navbtn" data-nav data-href="#/" data-sect="home" id="nav-home"></button>
  <button class="navbtn" data-nav data-href="#/films" data-sect="films" id="nav-films"></button>
  <button class="navbtn" data-nav data-href="#/tv" data-sect="tv" id="nav-tv"></button>
  <button class="navbtn" data-nav data-href="#/music" data-sect="music" id="nav-music"></button>
  <button class="navbtn" data-nav data-href="#/home-videos" data-sect="home-videos" id="nav-home-videos"></button>
  <div class="spacer"></div>
  <button class="navbtn" data-nav data-href="#/library" data-sect="library" id="nav-library"></button>
</nav>

<main class="main">
  <header class="top">
    <label class="search" for="q">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="Search films, series, music" autocomplete="off" aria-label="Search" data-nav>
    </label>
    <div class="top-right">
      <span class="srv" id="srv"><span class="led wait"></span>Connecting…</span>
      <button id="installbtn" class="devbtn install" data-nav hidden></button>
      <div class="devwrap">
        <button id="devbtn" class="devbtn" data-nav aria-haspopup="true" aria-expanded="false"></button>
        <div id="devmenu" class="devmenu" hidden></div>
      </div>
    </div>
  </header>
  <div id="view" aria-live="polite"></div>
  <p class="hint">Remote-ready: use <kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> to move, <kbd>Enter</kbd> to select, <kbd>Esc</kbd> to go back.</p>
</main>

<div class="player paused" id="player" hidden role="dialog" aria-label="Player">
  <div class="pv"><img id="pimg" alt=""><video id="pvideo" playsinline webkit-playsinline x-webkit-airplay="allow" preload="auto"></video></div>
  <div class="pmsg" id="pmsg" hidden></div>
  <div class="pseek" id="pseek" hidden aria-hidden="true"></div>
  <div class="pcast" id="pcast" hidden role="status">
    <p class="eyebrow" id="pcastkind">Casting</p>
    <b id="pcastdev"></b>
    <p id="pcastst"></p>
    <div class="pcastbtns" id="pcastbtns"><button class="btn small" id="pcstop" data-nav>Stop</button><button class="btn small" id="pcdisc" data-nav>Disconnect</button></div>
  </div>
  <div class="ptop">
    <button class="pbtn" id="pclose" data-nav aria-label="Close player"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="pt"><b id="ptitle"></b><span id="pdev"></span></div>
  </div>
  <div class="pinfo" id="pinfo" hidden><h3>Playback info</h3><dl class="kv" id="pinfobody"></dl><p class="note" id="pinfonote">Subtitle selection is coming soon: picking one does not change the stream yet.</p></div>
  <div class="pctrl">
    <div class="scrub"><span id="pcur">0:00</span><input type="range" id="pscrub" min="0" max="100" step="1" value="0" aria-label="Position" data-nav><span id="ptot">0:00</span></div>
    <div class="pbar">
      <button class="pbtn" id="pback" data-nav aria-label="Back 10 seconds"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
      <button class="pbtn big" id="pplay" data-nav aria-label="Play"></button>
      <button class="pbtn" id="pfwd" data-nav aria-label="Forward 30 seconds"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></button>
      <span class="grow"></span>
      <button class="ptxt" id="psub" data-nav>Subtitles <small id="psubv">Off</small></button>
      <button class="ptxt" id="paud" data-nav>Audio <small id="paudv">Default</small></button>
      <button class="ptxt" id="pext" data-nav hidden title="Play in VLC or another app (they can cast to a Chromecast)">Open in app…</button>
      <button class="ptxt" id="pinf" data-nav aria-expanded="false">Info</button>
      <button class="pbtn" id="pair" data-nav aria-label="AirPlay" hidden></button>
      <button class="pbtn" id="pcastbtn" data-nav aria-label="Cast to a Chromecast" hidden></button>
      <button class="pbtn" id="pfs" data-nav aria-label="Full screen" title="Full screen (F)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </div>
</div>

<div class="mini" id="mini" hidden>
  <img id="mimg" alt="">
  <div class="t"><b id="mt"></b><span id="ma"></span></div>
  <button class="pbtn" id="mplay" data-nav aria-label="Pause"></button>
  <div class="mbar"><i id="mprog"></i></div>
</div>
<audio id="maudio" preload="auto" hidden></audio>
<div class="toast" id="toast" hidden role="status"></div>

<script src="/static/app.js"></script>
<script src="/static/shared/slideshow.js"></script>
<script src="/static/shared/visualizer.js"></script>
<script src="/static/photos.js"></script>
</body>
</html>
